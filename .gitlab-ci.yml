# ============================================================================
# GitLab CI/CD 配置 - Vue Admin Template
# 参考 package.sh 脚本，兼容 GitLab 10.x+
# ============================================================================

stages:
  - install
  - lint
  - test
  - build
  - package
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .pnpm-store/

variables:
  NODE_VERSION: '22'
  BASE_IMAGE: 'nginx:alpine'
  REGISTRY_LOCAL: 'docker-local'
  REPO_PREFIX: 'vue-admin-template/web'
  IMAGE_PREFIX: 'vue-admin-web'
  PACKAGE_PREFIX: 'vue-admin-web'
  DEFAULT_LANGUAGE: 'zh-CN'
  # 部署配置（通过 GitLab CI/CD Variables 设置）
  # DEPLOY_SERVER_HOST: 'your-server.com'
  # DEPLOY_SERVER_USER: 'deploy'
  # DEPLOY_SERVER_PATH: '/opt/vue-admin-web'
  # DEPLOY_SSH_PRIVATE_KEY: '-----BEGIN RSA PRIVATE KEY-----...'

# ============================================================================
# 依赖安装
# ============================================================================
install:
  image: node:${NODE_VERSION}-alpine
  stage: install
  before_script:
    - npm install -g pnpm
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - .pnpm-store/
    expire_in: 1 hour

# ============================================================================
# 代码检查（并行执行）
# ============================================================================
lint:
  image: node:${NODE_VERSION}-alpine
  stage: lint
  before_script:
    - npm install -g pnpm
  script:
    - pnpm run lint

type-check:
  image: node:${NODE_VERSION}-alpine
  stage: lint
  before_script:
    - npm install -g pnpm
  script:
    - pnpm run type-check

# ============================================================================
# 单元测试
# ============================================================================
test:
  image: node:${NODE_VERSION}-alpine
  stage: test
  before_script:
    - apk add --no-cache git
    - npm install -g pnpm
  script:
    - pnpm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    expire_in: 30 days

# ============================================================================
# 构建前端资源
# 产出: dist/, version.html, node_build_info.sh
# ============================================================================
build:
  image: node:${NODE_VERSION}-alpine
  stage: build
  before_script:
    - apk add --no-cache git perl
    - npm install -g pnpm
  script:
    # 生成构建信息
    - export GIT_HASH=$(git rev-parse --short HEAD)
    - export GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
    - export BUILD_TIME=$(date "+%Y-%m-%d_%H-%M-%S")
    - export WEBSITE_IMAGE_NAME="${REGISTRY_LOCAL}/${REPO_PREFIX}:${GIT_HASH}"
    - |
      cat > node_build_info.sh << EOF
      hash=${GIT_HASH}
      build_at=${BUILD_TIME}
      branch=${GIT_BRANCH}
      website_docker_name=${WEBSITE_IMAGE_NAME}
      EOF
    - cp node_build_info.sh version.html
    - perl -p -i -e 's/\n/<br>/g' version.html
    # 构建前端
    - export defaultLanguage=${DEFAULT_LANGUAGE}
    - pnpm build
  artifacts:
    paths:
      - dist/
      - version.html
      - node_build_info.sh
    expire_in: 7 days

# ============================================================================
# 打包 Docker 镜像和部署包（仅 master 和 tags）
# 产出: vue-admin-web_${hash}_${timestamp}.tar.gz
# ============================================================================
package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache bash git coreutils tar
  script:
    - source node_build_info.sh
    - export IMAGE_TAG_NAME="${IMAGE_PREFIX}:${hash}"
    - export PACKAGE_NAME="${PACKAGE_PREFIX}_${hash}_$(date '+%Y-%m-%d_%H-%M-%S').tar.gz"
    # 创建静态资源包（热更新用）
    - tar -czf "static_assets_${hash}.tar.gz" dist version.html
    # 构建 Docker 镜像
    - docker build -f Dockerfile -t "${website_docker_name}" --build-arg BASE_IMAGE="${BASE_IMAGE}" .
    # 准备部署文件
    - mkdir -p vue_admin_web
    - cp -r deploy/* vue_admin_web/
    # 保存 Docker 镜像
    - docker tag "${website_docker_name}" "${IMAGE_TAG_NAME}"
    - docker save "${IMAGE_TAG_NAME}" -o "vue_admin_web/${IMAGE_TAG_NAME//:/\_}.tar"
    # 更新构建信息（添加 MD5）
    - echo "web_docker_md5=$(md5sum vue_admin_web/${IMAGE_TAG_NAME//:/\_}.tar | awk '{print $1}')" >> node_build_info.sh
    - cp node_build_info.sh vue_admin_web/
    # 创建最终部署包
    - tar -czf "${PACKAGE_NAME}" vue_admin_web
    - echo "Package created - ${PACKAGE_NAME}"
  artifacts:
    paths:
      - '*.tar.gz'
      - node_build_info.sh
    expire_in: 30 days
  only:
    - master
    - /^release\/.*$/
    - tags

# ============================================================================
# 部署到服务器（master、release/* 分支和 tags）
# 完整部署：上传部署包 + 自动部署
# ============================================================================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - echo "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "${DEPLOY_SERVER_HOST}" >> ~/.ssh/known_hosts
  script:
    - source node_build_info.sh
    - export PACKAGE_NAME="${PACKAGE_PREFIX}_${hash}_*.tar.gz"
    - export PACKAGE_FILE=$(ls ${PACKAGE_NAME} | head -1)
    - |
      echo "=========================================="
      echo "部署信息:"
      echo "  分支/标签: ${CI_COMMIT_REF_NAME}"
      echo "  服务器: ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}"
      echo "  路径: ${DEPLOY_SERVER_PATH}"
      echo "  部署包: ${PACKAGE_FILE}"
      echo "  Git Hash: ${hash}"
      echo "  构建时间: ${build_at}"
      echo "=========================================="
    # 上传部署包到服务器
    - scp -o StrictHostKeyChecking=no "${PACKAGE_FILE}" "${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:${DEPLOY_SERVER_PATH}/"
    # 在服务器上执行部署
    - |
      ssh -o StrictHostKeyChecking=no "${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}" << EOF
        set -e
        cd ${DEPLOY_SERVER_PATH}

        # 解压部署包
        echo "解压部署包..."
        tar -xzf ${PACKAGE_FILE}

        # 进入部署目录
        cd vue_admin_web

        # 加载 Docker 镜像
        echo "加载 Docker 镜像..."
        docker load -i vue-admin-web_*.tar

        # 停止旧容器
        echo "停止旧容器..."
        ./manage.sh stop || true
        ./manage.sh remove || true

        # 启动新容器
        echo "启动新容器..."
        ./manage.sh start

        # 显示状态
        echo "部署完成！"
        ./manage.sh status

        # 清理旧部署包（保留最近3个）
        cd ${DEPLOY_SERVER_PATH}
        ls -t ${PACKAGE_PREFIX}_*.tar.gz | tail -n +4 | xargs -r rm -f

        echo "=========================================="
        echo "部署成功！"
        echo "访问地址: http://${DEPLOY_SERVER_HOST}:31180"
        echo "版本信息: http://${DEPLOY_SERVER_HOST}:31180/web/version"
        echo "=========================================="
      EOF
  only:
    - master
    - /^release\/.*$/
    - tags
  when: manual
  environment:
    name: production
    url: http://${DEPLOY_SERVER_HOST}:31180
