# 代码质量检查工作流
# 职责: lint、type-check、test
#
# 触发条件:
#   1. PR 提交到 main / master / release/** 分支
#   2. push 到 main / master / release/** 分支
#   3. 手动触发 (workflow_dispatch)

name: Check Quality

on:
  pull_request:
    branches: [main, master, 'release/**']
  push:
    branches: [main, master, 'release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================
  # Install - 安装依赖（首先执行）
  # ============================
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache dependencies
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: build-${{ github.sha }}

  # ============================
  # Lint - 代码规范检查
  # ============================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Lint
        run: pnpm run lint:ci

  # ============================
  # Type Check - TypeScript 类型检查
  # ============================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: TypeScript type check
        run: pnpm run type-check

  # ============================
  # Test - 单元测试
  # ============================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run tests
        run: pnpm run test
