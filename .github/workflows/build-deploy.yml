# 构建与部署工作流
# 构建 Docker 镜像并通过 SSH 部署到阿里云 ECS
#
# 触发条件:
#   1. Check Quality 在 master 分支通过后自动触发
#   2. 手动触发 (可选择是否部署)
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加:
#     - DEPLOY_SERVER_HOST: 服务器 IP 或域名
#     - DEPLOY_SERVER_USER: SSH 用户名
#     - DEPLOY_SERVER_PATH: 部署目标路径
#     - DEPLOY_SSH_PRIVATE_KEY: SSH 私钥 (完整内容，包括 BEGIN/END)

name: Build and Deploy

on:
  workflow_run:
    workflows: ['Check Quality']
    branches: [master]
    types: [completed]

  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean

concurrency:
  group: build-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  BASE_IMAGE: 'nginx:alpine'
  REGISTRY_LOCAL: 'docker-local'
  REPO_PREFIX: 'electron-react/web'
  IMAGE_PREFIX: 'electron-react-web'
  PACKAGE_PREFIX: 'electron-react-web'
  DEFAULT_LANGUAGE: 'zh-CN'

jobs:
  # ==================== 构建 ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    # 仅在 Check Quality 成功后执行，或手动触发
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build info
        id: info
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          BUILD_TIME=$(date "+%Y-%m-%d_%H-%M-%S")
          WEBSITE_IMAGE_NAME="${{ env.REGISTRY_LOCAL }}/${{ env.REPO_PREFIX }}:${GIT_HASH}"

          cat > node_build_info.sh << EOF
          hash=${GIT_HASH}
          build_at=${BUILD_TIME}
          branch=${GIT_BRANCH}
          website_docker_name=${WEBSITE_IMAGE_NAME}
          EOF

          cp node_build_info.sh version.html
          perl -p -i -e 's/\n/<br>/g' version.html

          echo "git_hash=${GIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build
        env:
          VITE_DEFAULT_LANGUAGE: ${{ env.DEFAULT_LANGUAGE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            version.html
            node_build_info.sh
          retention-days: 7

  # ==================== 打包 Docker 镜像 ====================
  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Build Docker image & create deploy package
        run: |
          source node_build_info.sh
          IMAGE_TAG_NAME="${{ env.IMAGE_PREFIX }}:${hash}"
          PACKAGE_NAME="${{ env.PACKAGE_PREFIX }}_${hash}_$(date '+%Y-%m-%d_%H-%M-%S').tar.gz"

          # 创建静态资源包（热更新用）
          tar -czf "static_assets_${hash}.tar.gz" dist version.html

          # 构建 Docker 镜像
          docker build -f Dockerfile -t "${website_docker_name}" --build-arg BASE_IMAGE="${{ env.BASE_IMAGE }}" .

          # 准备部署文件
          mkdir -p electron_react_web
          cp -r deploy/* electron_react_web/

          # 保存 Docker 镜像
          docker tag "${website_docker_name}" "${IMAGE_TAG_NAME}"
          docker save "${IMAGE_TAG_NAME}" -o "electron_react_web/${IMAGE_TAG_NAME//:/\_}.tar"

          # 更新构建信息（添加 MD5）
          echo "web_docker_md5=$(md5sum electron_react_web/${IMAGE_TAG_NAME//:/\_}.tar | awk '{print $1}')" >> node_build_info.sh
          cp node_build_info.sh electron_react_web/

          # 创建最终部署包
          tar -czf "${PACKAGE_NAME}" electron_react_web
          echo "Package created - ${PACKAGE_NAME}"

      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: |
            *.tar.gz
            node_build_info.sh
          retention-days: 30

  # ==================== 部署到阿里云 ECS ====================
  deploy:
    name: Deploy to Aliyun
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' || github.event.inputs.deploy == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: http://${{ secrets.DEPLOY_SERVER_HOST }}:31190

    steps:
      - name: Check secrets
        run: |
          has_error=0
          if [[ -z "${{ secrets.DEPLOY_SERVER_HOST }}" ]]; then
            echo "::error::缺少 DEPLOY_SERVER_HOST secret"
            has_error=1
          fi
          if [[ -z "${{ secrets.DEPLOY_SERVER_USER }}" ]]; then
            echo "::error::缺少 DEPLOY_SERVER_USER secret"
            has_error=1
          fi
          if [[ -z "${{ secrets.DEPLOY_SERVER_PATH }}" ]]; then
            echo "::error::缺少 DEPLOY_SERVER_PATH secret"
            has_error=1
          fi
          if [[ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ]]; then
            echo "::error::缺少 DEPLOY_SSH_PRIVATE_KEY secret"
            has_error=1
          fi
          if [[ $has_error -eq 1 ]]; then
            echo "请在 Settings -> Secrets and variables -> Actions 中配置以上 secrets"
            exit 1
          fi
          echo "✅ Secrets 配置正确"

      - name: Download deploy package
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_SERVER_PATH }}
        run: |
          source node_build_info.sh
          PACKAGE_FILE=$(ls ${{ env.PACKAGE_PREFIX }}_${hash}_*.tar.gz | head -1)

          echo "=========================================="
          echo "部署信息:"
          echo "  分支: ${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "  服务器: ${DEPLOY_USER}@${DEPLOY_HOST}"
          echo "  路径: ${DEPLOY_PATH}"
          echo "  部署包: ${PACKAGE_FILE}"
          echo "  Git Hash: ${hash}"
          echo "  构建时间: ${build_at}"
          echo "=========================================="

          # 上传部署包到服务器
          scp -i ~/.ssh/deploy_key "${PACKAGE_FILE}" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

          # 在服务器上执行部署
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            set -e
            cd ${DEPLOY_PATH}

            # 解压部署包
            echo "解压部署包..."
            tar -xzf $(basename ${PACKAGE_FILE})

            # 进入部署目录
            cd electron_react_web

            # 加载 Docker 镜像
            echo "加载 Docker 镜像..."
            docker load -i electron-react-web_*.tar

            # 停止旧容器
            echo "停止旧容器..."
            ./manage.sh stop || true
            ./manage.sh remove || true

            # 启动新容器
            echo "启动新容器..."
            ./manage.sh start

            # 显示状态
            echo "部署完成！"
            ./manage.sh status

            # 清理旧部署包（保留最近3个）
            cd ${DEPLOY_PATH}
            ls -t ${{ env.PACKAGE_PREFIX }}_*.tar.gz | tail -n +4 | xargs -r rm -f

            echo "=========================================="
            echo "部署成功！"
            echo "访问地址: http://${DEPLOY_HOST}:31190"
            echo "版本信息: http://${DEPLOY_HOST}:31190/web/version"
            echo "=========================================="
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ==================== 通知 ====================
  notify:
    name: Notify
    needs: [build, package, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "# 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 打包 | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🖥️ **服务器**: ${{ secrets.DEPLOY_SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          fi
